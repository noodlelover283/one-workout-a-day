  <script>
    // Keep a copy of each language's text so the tests can compare them.
    const registeredLanguages = {};
    const registerLanguage = I18n.register;
    I18n.register = (code, definition) => {
      registeredLanguages[code] = definition;
      registerLanguage(code, definition);
    };
  </script>
